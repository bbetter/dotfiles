# hypridle — launched from autostart.lua (replaced idle.sh/swayidle, which is
# kept unwired as a fallback). It honours D-Bus idle inhibitors automatically
# (mpv, browsers in fullscreen video, Steam); the sidebar "Keep awake" toggle's
# guard file is checked by idle-skip.sh for the manual case.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Both listeners below also skip via idle-skip.sh while the focused window is
# fullscreen (games, mostly — controller-only play or a long cutscene means no
# mouse/kb activity for minutes at a time, but dbus idle-inhibit isn't sent
# reliably by every game).

# Lock after 5 min idle (unless kept awake, per idle-skip.sh).
listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/idle-skip.sh || loginctl lock-session
}

# Blank the screens 5 min after that.
listener {
    timeout = 600
    on-timeout = $HOME/.config/hypr/idle-skip.sh || hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
