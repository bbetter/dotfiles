# hypridle — replacement for idle.sh/swayidle.
# Activate: sudo pacman -S hyprlock hypridle, then launch `hypridle` from
# autostart.lua instead of idle.sh. hypridle honours D-Bus idle inhibitors
# automatically (mpv, browsers in fullscreen video, Steam), so that side of
# "keep awake" becomes free; the sidebar toggle's guard file is still checked
# for the manual case.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Lock after 5 min idle (unless the sidebar "Keep awake" guard is set).
listener {
    timeout = 300
    on-timeout = [ -e "$XDG_RUNTIME_DIR/ags-keep-awake" ] || loginctl lock-session
}

# Blank the screens 5 min after that.
listener {
    timeout = 600
    on-timeout = [ -e "$XDG_RUNTIME_DIR/ags-keep-awake" ] || hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
