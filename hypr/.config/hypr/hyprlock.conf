# hyprlock — themed by ~/.config/scripts/gen-theme.sh from the wal palette.
# Edit this template, not hyprlock.conf.
#
# Activation (once): sudo pacman -S hyprlock hypridle
#   binds.lua      : SUPER+SHIFT+ESCAPE -> "loginctl lock-session"
#   autostart.lua  : launch "hypridle" instead of idle.sh
# idle.sh / swayidle / swaylock can stay installed as a fallback.

$font = JetBrainsMono Nerd Font

background {
    monitor =
    path = screenshot          # blur the live desktop (no wallpaper file needed)
    blur_passes = 3
    blur_size = 5
    brightness = 0.70
    contrast = 0.90
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 320, 56
    position = 0, -90
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 14
    dots_size = 0.28
    dots_spacing = 0.30
    dots_center = true

    outer_color = rgba(ae95c7ff)
    inner_color = rgba(1c2023d9)
    font_color  = rgba(c7ccd1ff)
    check_color = rgba(95aec7ff)
    fail_color  = rgba(c7ae95ff)

    placeholder_text = <span foreground="##c7ccd1">󰌾  Password</span>
    fail_text = <span foreground="##c7ae95">󰀦  $FAIL (attempt $ATTEMPTS)</span>
    fade_on_empty = false
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = $font
    font_size = 92
    color = rgba(c7ccd1ff)
    position = 0, 170
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = $font
    font_size = 20
    color = rgba(c7ccd1cc)
    position = 0, 80
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =    $USER
    font_family = $font
    font_size = 15
    color = rgba(ae95c7ff)
    position = 0, -28
    halign = center
    valign = center
}
